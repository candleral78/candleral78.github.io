<title>블로그 첨삭</title>
<style>
/*FONTFACE*/
/* 컨설턴트 1인용 검수 도구. 글쓰기 앱과 같은 색·글꼴을 쓰고, 첨삭지만 빨간 펜 교정지처럼 보이게 한다. */
:root{
  --bg:#f7f4f4; --surface:#ffffff; --sunk:#f0ebec; --ink:#1d1618; --muted:#6b5f62; --line:#e2d9db;
  --accent:#c0112f; --on-accent:#ffffff; --accent-soft:#fbe9ec; --ok:#1c7a4a; --ok-soft:#e5f3eb; --warn:#9a5600; --warn-soft:#fbf0e1;
  --pen:#d0162f; --paper:#fffdfb;
  --font:"Gmarket Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171213; --surface:#211a1c; --sunk:#2a2124; --ink:#f1eaeb; --muted:#ab9fa2; --line:#3a2e31;
  --accent:#ea4a63; --on-accent:#1a0d10; --accent-soft:#3a1a21; --ok:#5cc48d; --ok-soft:#173326; --warn:#e2a84b; --warn-soft:#3a2a12;
  --pen:#ff5a72; --paper:#1d1719; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#171213; --surface:#211a1c; --sunk:#2a2124; --ink:#f1eaeb; --muted:#ab9fa2; --line:#3a2e31;
  --accent:#ea4a63; --on-accent:#1a0d10; --accent-soft:#3a1a21; --ok:#5cc48d; --ok-soft:#173326; --warn:#e2a84b; --warn-soft:#3a2a12;
  --pen:#ff5a72; --paper:#1d1719; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.hint,.status,small{font-weight:300}
b,strong,h1,h2,h3,th{font-weight:700}
input,textarea,select,button{font:inherit;font-weight:500}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 72px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;line-height:1.25;margin:0}
h2{font-size:1.18rem;margin:0}
h3{font-size:1rem;margin:0}
p{margin:0}
.hint{color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:6px}
.tabs button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.9rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
label small{color:var(--muted)}
input[type=text],input[type=url],input[type=password],input[type=number],textarea,select{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-weight:700;border-radius:8px;padding:11px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;min-height:44px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.small{padding:6px 12px;min-height:34px;font-size:.86rem;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg label{flex-direction:row;align-items:center;gap:6px;padding:8px 14px;cursor:pointer;font-size:.92rem;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
legend{font-size:.95rem;padding:0;margin-bottom:6px}
.status{color:var(--muted);font-size:.92rem;min-height:1.4em}
.status.err{color:var(--accent);font-weight:500}
.notice{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:.92rem}
table.plain{border-collapse:collapse;width:100%;font-size:.9rem}
table.plain th,table.plain td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.plain th{color:var(--muted);font-weight:500;white-space:nowrap}
.kwrow{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;align-items:center}
.list{display:flex;flex-direction:column}
.list button{display:flex;justify-content:space-between;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;text-align:left;cursor:pointer;color:var(--ink)}
.list button:hover{background:var(--sunk)}
.list small{color:var(--muted)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:96px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line)}
a{color:var(--accent)}

/* ---------- 첨삭지 ---------- */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:26px 24px 30px;display:flex;flex-direction:column;gap:26px}
.sheet .masthead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px}
.sheet .masthead h2{font-size:1.25rem}
.sheet .masthead .meta{font-size:.85rem;color:var(--muted)}
.opinion{border:1.5px solid var(--pen);color:var(--ink);border-radius:4px;padding:12px 14px;font-size:.92rem;line-height:1.7}
.opinion[contenteditable=true]{background:var(--surface)}
.sheet h3{font-size:1.02rem;display:flex;gap:8px;align-items:baseline}
.sheet h3 small{color:var(--muted);font-size:.82rem}
.verdict{display:flex;flex-direction:column;gap:6px}
.verdict .head{font-size:1.35rem;font-weight:700;line-height:1.3}
.verdict .head.must{color:var(--pen)}
.counts{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem}
.counts span b{font-size:1.1rem;margin-right:3px}
.facts{font-size:.85rem;color:var(--muted)}
.good{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:1.1em}
.kwtable td.miss{color:var(--pen);font-weight:700}
.kwtable .ev{font-size:.8rem;color:var(--muted)}
.check{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.check .g{font-weight:700;margin-top:8px}
.check .it{display:grid;grid-template-columns:4.6em 1fr 2.6em;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px dotted var(--line)}
.check .st{font-weight:700;font-size:.85rem}
.check .st.no{color:var(--pen)} .check .st.yes{color:var(--ok)}
.check .who{color:var(--muted);font-size:.78rem;text-align:right}
.check .it.hot{background:var(--accent-soft)}

/* 전체 첨삭지: 재구성한 글 + 여백의 빨간 번호 */
.proof{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:18px 18px 18px 52px;display:flex;flex-direction:column;gap:10px;max-width:640px}
.proof .blk{position:relative;font-size:.93rem;line-height:1.75}
.proof .blk.title{font-size:1.12rem;font-weight:700;line-height:1.45}
.proof .blk.heading{font-weight:700}
.proof .blk.quote{border-left:3px solid var(--ink);padding-left:12px}
.proof .blk.divider{border-top:1px solid var(--line);margin:4px 0}
.proof .blk.img img{max-width:240px;max-height:200px;border-radius:3px;display:block}
.proof .blk.ph{font-size:.82rem;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:6px 10px}
.proof .blk.flag{outline:1.5px solid var(--pen);outline-offset:3px;border-radius:2px}
.marks{position:absolute;left:-40px;top:0;display:flex;flex-direction:column;gap:3px}
.mk{width:24px;height:24px;border-radius:50%;background:var(--pen);color:#fff;font-size:.78rem;font-weight:700;display:grid;place-items:center;line-height:1;text-decoration:none}
.mk.soft{background:none;color:var(--pen);border:1.5px solid var(--pen)}
mark.q{background:none;color:inherit;text-decoration:underline wavy var(--pen);text-decoration-thickness:1.5px;text-underline-offset:4px}
.viewtag{font-size:.78rem;color:var(--muted)}

/* 첨삭 카드 */
.cards{display:flex;flex-direction:column;gap:18px}
.card{border-top:2px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.card.off{opacity:.45}
.card .ch{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card .ch h4{margin:0;font-size:1rem}
.tag{font-size:.78rem;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.tag.must{background:var(--pen);border-color:var(--pen);color:#fff}
.tag.check{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tag.suggest{border-color:var(--ink);color:var(--ink)}
.excerpt{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:12px 14px;font-size:.9rem;line-height:1.75;max-width:600px}
.excerpt img,.excerpt canvas{max-width:100%;max-height:300px;display:block;border-radius:3px}
.excerpt .ctx{color:var(--muted)}
.comment{font-size:.95rem;line-height:1.75}
.comment[contenteditable=true],.sugg[contenteditable=true]{background:var(--surface);border:1px dashed var(--muted);border-radius:4px;padding:6px 8px}
.fix{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);border-radius:6px;padding:10px 12px}
.fix .lbl{font-size:.8rem;color:var(--ok);font-weight:700;white-space:nowrap;padding-top:2px}
.fix .sugg{flex:1;font-size:.93rem}
.evid{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.evid b{color:var(--ink);font-weight:500}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.only-edit{display:none}
.editing .only-edit{display:flex}
.exporting .only-edit,.exporting .no-export{display:none!important}
.exporting .card.off{display:none}
@media (max-width:560px){ .sheet{padding:18px 14px} .proof{padding-left:40px} .marks{left:-32px} .check .it{grid-template-columns:4em 1fr} .check .who{display:none} }

/* 한눈에 보기 */
.glance{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--surface)}
.glance .g-title{font-size:.88rem;color:var(--muted)}
.glance .head{font-size:1.4rem;font-weight:700;line-height:1.3;margin:4px 0 8px}
.glance .head.must{color:var(--pen)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted);margin-top:8px}
.stats b{color:var(--ink);font-size:.95rem;margin-right:2px}
.firsts{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.firsts a{display:flex;gap:8px;align-items:center;color:var(--ink);text-decoration:none;font-weight:500}
.firsts a:hover{text-decoration:underline}
.goodline{font-size:.86rem;margin-top:10px;color:var(--muted)}
.goodline b{color:var(--ok);margin-right:4px}
.split{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;align-items:start}
.orig{position:sticky;top:10px;display:flex;flex-direction:column;gap:8px}
.orighead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.origscroll{height:78vh;overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:inset 0 0 0 6px var(--sunk)}
.origscroll .proof{border:0;max-width:none}
.nview{display:block}
.toolbar{margin:6px 0 10px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.capwrap canvas{width:100%;display:block}
.cards-h{margin-bottom:-4px}
.card{cursor:pointer}
details.sec{border-top:2px solid var(--ink);padding-top:10px}
details.sec>summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px;cursor:pointer;flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3::before{content:"▸ ";color:var(--muted)}
details.sec[open]>summary h3::before{content:"▾ "}
details.sec .sum{font-size:.85rem;color:var(--muted)}
.secbody{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.lbl2{font-weight:700;font-size:.92rem;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.86rem;background:var(--surface);display:inline-flex;gap:5px;align-items:baseline}
.chip small{color:var(--muted);font-size:.74rem}
.chip.brand{border-color:var(--pen);color:var(--pen)}
.chip.on{background:var(--sunk)}
.miss{color:var(--pen);font-weight:700}
.aich{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.aich li{display:grid;grid-template-columns:1.6em 13em 1fr;gap:8px;font-size:.9rem;align-items:baseline}
.aich li.no b{color:var(--pen)}
.nexts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:10px}
.nexts li{display:flex;flex-direction:column;gap:2px}
@media (max-width:980px){ .split{grid-template-columns:1fr} .orig{position:static} .origscroll{height:70vh} }
@media (max-width:620px){ .glance{grid-template-columns:1fr} .aich li{grid-template-columns:1.6em 1fr} .aich li span:last-child{grid-column:2} }
.exporting .split{grid-template-columns:1fr} .exporting .glance{grid-template-columns:1fr} .exporting .aich li{grid-template-columns:1.6em 1fr} .exporting .aich li span:last-child{grid-column:2}
@page{size:A4;margin:12mm 11mm}
@media print{
  html,body{background:#fff!important;color:#000}
  header.top,.tabs,.no-print,.only-edit,#reviewForm,.copy,.toolbar{display:none!important}
  .wrap{max-width:none;padding:0;gap:0} .sheet{border:0;padding:0;gap:16px;background:#fff}
  .glance{grid-template-columns:1.1fr 1fr;break-inside:avoid}
  .split{display:contents} .cards{order:1} details.sec{order:2} .orig{order:3;position:static;width:430px;max-width:100%;break-before:page} .foot{order:4}
  .orighead h3::after{content:" (부록)"} .origscroll,.printing .origscroll{height:auto!important;overflow:visible!important;border:1px solid #ccc;border-radius:6px;box-shadow:none}
  .orighead{break-after:avoid}
  .card{break-inside:avoid;cursor:default} .card.off{display:none}
  details.sec{break-inside:auto} details.sec>summary h3::before{content:""}
  .fix,.excerpt,.aich li,.check .it,.kwtable tr{break-inside:avoid}
  a{color:#000;text-decoration:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.printing .origscroll{height:auto!important;overflow:visible!important}
.printing .orig{width:430px}
@media (prefers-reduced-motion:no-preference){ .card{scroll-margin-top:16px} }
</style>

<div class="wrap">
  <header class="top">
    <div><h1>블로그 첨삭</h1><p class="hint">업체 기준으로 블로그 글을 검수하고 대표님께 보낼 첨삭지를 만듭니다</p></div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" data-tab="review" aria-selected="true">검수</button>
      <button role="tab" data-tab="biz" aria-selected="false">업체</button>
      <button role="tab" data-tab="history" aria-selected="false">기록</button>
    </nav>
  </header>

  <!-- 들어가기 -->
  <section class="panel" id="login">
    <h2>암호를 넣어 주세요</h2>
    <label>암호<input type="password" id="pw" autocomplete="current-password"></label>
    <div class="row"><button class="btn" id="loginBtn">들어가기</button><span class="status" id="loginStatus"></span></div>
  </section>

  <!-- 검수 -->
  <div id="tab-review" hidden>
    <section class="panel" id="reviewForm">
      <h2>검수할 글</h2>
      <label>업체<select id="rvBiz"></select></label>
      <fieldset><legend>글 넣는 방법</legend>
        <div class="seg" id="rvSource">
          <label><input type="radio" name="src" value="link" checked>발행 글 링크</label>
          <label><input type="radio" name="src" value="text">원고 붙여넣기</label>
          <label><input type="radio" name="src" value="capture">화면 캡처</label>
        </div>
      </fieldset>
      <label data-src="link">블로그 글 주소<input type="url" id="rvUrl" placeholder="https://blog.naver.com/아이디/글번호"></label>
      <div data-src="text" hidden class="grid2" style="grid-template-columns:1fr">
        <label>원고<small>첫 줄은 제목입니다. 사진 자리는 [사진], 지도는 [지도], 인용구는 [인용: 문장]으로 적어 주세요.</small><textarea id="rvText" rows="10"></textarea></label>
      </div>
      <div data-src="capture" hidden>
        <label>휴대폰 화면 캡처<small>위에서부터 순서대로 여러 장 올려 주세요. 캡처는 저장하지 않고 이번 첨삭지에만 씁니다.</small><input type="file" id="rvImgs" accept="image/*" multiple></label>
        <div class="thumbs" id="rvThumbs"></div>
      </div>
      <div class="grid2">
        <label>이번 글 목표 키워드<small>쉼표로 구분, 최대 3개. 업체 핵심 키워드는 자동으로 함께 봅니다.</small><input type="text" id="rvKw" placeholder="예: 반포 초등수학"></label>
        <label>글 유형<select id="rvType"><option value="">고르지 않음</option><option>방문 후기</option><option>업체 소개</option><option>상품·서비스 소개</option><option>행사 안내</option><option>정보성</option></select></label>
      </div>
      <div class="grid2">
        <fieldset><legend>협찬·지원을 받은 글인가요?</legend>
          <div class="seg"><label><input type="radio" name="sp" value="no">아니요</label><label><input type="radio" name="sp" value="yes">예</label><label><input type="radio" name="sp" value="" checked>모름</label></div>
        </fieldset>
        <fieldset><legend>AI로 만든 이미지가 있나요?</legend>
          <div class="seg"><label><input type="radio" name="ai" value="no">없음</label><label><input type="radio" name="ai" value="yes">있음</label><label><input type="radio" name="ai" value="person">인물 포함</label><label><input type="radio" name="ai" value="" checked>모름</label></div>
        </fieldset>
      </div>
      <div class="row"><button class="btn" id="rvGo">검수 시작</button><span class="status" id="rvStatus" role="status"></span></div>
    </section>
    <div id="result"></div>
  </div>

  <!-- 업체 -->
  <div id="tab-biz" hidden>
    <section class="panel">
      <div class="row" style="justify-content:space-between"><h2>업체</h2><button class="btn small" id="bizNew">새 업체</button></div>
      <div class="list" id="bizList"></div>
    </section>
    <section class="panel" id="bizForm" hidden>
      <h2 id="bizFormTitle">업체 등록</h2>
      <div class="notice">플레이스 정보는 구글 서버에서 자동으로 읽히지 않아 <b>플레이스 화면 캡처</b>로 채웁니다. 캡처를 올리면 칸이 채워지고 확인일이 남습니다.</div>
      <label>플레이스 화면 캡처<input type="file" id="bzCap" accept="image/*" multiple></label>
      <span class="status" id="bzCapStatus"></span>
      <div class="grid2">
        <label>업체명<input type="text" id="bzName"></label>
        <label>업종<select id="bzInd"><option>학원·교육</option><option>음식점·식품</option><option>의료·미용</option><option>숙박·레저</option><option>기타</option></select></label>
        <label>플레이스 주소<small>네이버 지도에서 업체를 연 주소를 그대로 붙여 넣어 주세요.</small><input type="url" id="bzPlace"></label>
        <label>블로그 주소<input type="url" id="bzBlog" placeholder="https://blog.naver.com/아이디"></label>
        <label>주소<input type="text" id="bzAddr"></label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>

  if(!j.ok) throw {code:j.code,message:j.message||"오류가 났습니다."};

}

$("#bzSave").onclick=async()=>{
  const rules={}; $$("#ruleRows tr").forEach(tr=>{ const v=tr.querySelector(".rv"); rules[tr.dataset.k]={value:v?+v.value:"",level:tr.querySelector(".rl").value} });
  const biz={ name:$("#bzName").value.trim(), industry:$("#bzInd").value, placeUrl:$("#bzPlace").value.trim(), blogUrl:$("#bzBlog").value.trim(), address:$("#bzAddr").value.trim(), phone:$("#bzPhone").value.trim(), hours:$("#bzHours").value.trim(), placeCheckedAt:$("#bzChecked").value.trim(), guideNote:$("#bzNote").value.trim(),
    coreKeywords:$$("#kwRows .kwrow").map(r=>({kw:r.querySelector(".kw").value.trim(),type:r.querySelector(".kt").value})).filter(k=>k.kw), rules };
  if(!biz.name) return status($("#bzStatus"),"업체명을 넣어 주세요.",true);
  if(biz.placeUrl && !/place\/\d{5,}|^\d{5,}$/.test(biz.placeUrl)) return status($("#bzStatus"),"플레이스 주소에서 장소 번호를 찾지 못했습니다. 지도에서 업체를 연 주소를 붙여 넣어 주세요.",true);
  status($("#bzStatus"),"저장하는 중…");
  try{ const id=await api("saveBiz",{id:EDIT_BIZ,biz}); EDIT_BIZ=id; await loadBiz(); $("#rvBiz").value=id; status($("#bzStatus"),"저장했습니다.") }catch(e){ status($("#bzStatus"),e.message,true) } };

/* ---------- 검수 ---------- */
const srcVal=()=>$("input[name=src]:checked").value;
$$("input[name=src]").forEach(r=>r.onchange=()=>{ $$("[data-src]").forEach(el=>el.hidden=el.dataset.src!==srcVal()) });
async function toJpeg(file,maxW){
  const url=URL.createObjectURL(file); const img=await new Promise((ok,no)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url});
  const scale=Math.min(1,maxW/img.width), c=document.createElement("canvas"); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); return c.toDataURL("image/jpeg",.85);
}
$("#rvImgs").onchange=async e=>{ CAPTURE=await Promise.all([...e.target.files].slice(0,8).map(f=>toJpeg(f,1100))); $("#rvThumbs").innerHTML=CAPTURE.map((d,i)=>`<img src="${d}" alt="캡처 ${i+1}">`).join("") };
$("#rvGo").onclick=async()=>{
  const bizId=$("#rvBiz").value; if(!bizId) return status($("#rvStatus"),"업체를 먼저 등록해 주세요.",true);
  const src=srcVal(), req={bizId,source:src,keywords:$("#rvKw").value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,3),postType:$("#rvType").value,sponsored:$("input[name=sp]:checked").value,aiImages:$("input[name=ai]:checked").value};
  if(src==="link"){ req.url=$("#rvUrl").value.trim(); if(!req.url) return status($("#rvStatus"),"글 주소를 넣어 주세요.",true) }
  if(src==="text"){ req.text=$("#rvText").value; if(!req.text.trim()) return status($("#rvStatus"),"원고를 붙여 넣어 주세요.",true) }
  if(src==="capture"){ if(!CAPTURE.length) return status($("#rvStatus"),"캡처를 올려 주세요.",true); req.images=CAPTURE.map(d=>d.split(",")[1]) }
  ls.set("br_lastBiz",bizId); $("#rvGo").disabled=true; $("#result").innerHTML="";
  status($("#rvStatus"),"글을 읽고, 키워드 근거를 조회하고, 첨삭하는 중입니다. 1분 정도 걸립니다…");
  try{ const r=await api("review",req); r._capture=src==="capture"?CAPTURE.slice():null; CUR=r; status($("#rvStatus"),r.aiError||""); renderSheet(); $("#result").scrollIntoView({behavior:"smooth",block:"start"}) }
  catch(e){ status($("#rvStatus"),e.message,true) } finally{ $("#rvGo").disabled=false } };

/* ---------- 첨삭지 그리기 ---------- */
const TAGCLS={"수정 필요":"must","추가 확인":"check","확인 불가":"check","권장":"suggest"};
const TAGTXT={"수정 필요":"꼭 고쳐 주세요","추가 확인":"확인해 주세요","확인 불가":"확인 불가","권장":"권해 드려요"};
function hl(text,quote){ const t=esc(text); if(!quote) return t; const q=esc(quote); const i=t.indexOf(q); if(i<0) return t; return t.slice(0,i)+`<mark class="q">${q}</mark>`+t.slice(i+q.length) }
function blockHtml(b,quote,full){
  if(b.type==="image") return b.src?`<img src="${esc(b.src)}" alt="${esc(b.caption||"본문 사진")}" referrerpolicy="no-referrer" crossorigin="anonymous" data-src="${esc(b.src)}" loading="lazy">`+(b.caption?`<small>${esc(b.caption)}</small>`:""):`<span class="ph">[사진${b.alt?": "+esc(b.alt):""}]</span>`;
  if(b.type==="map") return `<span class="ph">지도: ${esc(b.name||b.text||"")}${b.address?" · "+esc(b.address):""}${b.placeId?" · 장소 번호 "+esc(b.placeId):""}</span>`;
  if(b.type==="divider") return "";
  if(b.type==="link") return `<span class="ph">링크: ${esc(b.text||b.url||"")}</span>`;
  if(b.type==="video") return `<span class="ph">[동영상]</span>`;
  if(b.type==="sticker") return `<span class="ph">[스티커]</span>`;
  return hl(b.text||"",quote);
}
function blkClass(b){ return "blk "+({title:"title",heading:"heading",quote:"quote",divider:"divider",image:"img"}[b.type]||"")+(["map","link","video","sticker"].includes(b.type)||(b.type==="image"&&!b.src)?" ph":"") }
function cropCanvas(b){
  const src=CUR._capture&&CUR._capture[b.img]; if(!src||!b.box) return null;
  const c=document.createElement("canvas"), img=new Image(); img.src=src;
  img.onload=()=>{ const [y0,x0,y1,x1]=b.box.map(v=>v/1000), pad=.03, W=img.width, H=img.height;
    const sx=Math.max(0,(x0-pad))*W, sy=Math.max(0,(y0-pad))*H, ex=Math.min(1,x1+pad)*W, ey=Math.min(1,y1+pad)*H;
    c.width=ex-sx; c.height=ey-sy; const g=c.getContext("2d"); g.drawImage(img,sx,sy,ex-sx,ey-sy,0,0,c.width,c.height);
    g.strokeStyle="#d0162f"; g.lineWidth=Math.max(3,W/250); g.strokeRect(x0*W-sx,y0*H-sy,(x1-x0)*W,(y1-y0)*H) };
  return c;
}
function capOverlay(r,byNo){
  // 캡처 검수: 올린 화면 전체 위에 번호와 빨간 상자
  const wrap=document.createElement("div"); wrap.className="capwrap";
  (r._capture||[]).forEach((src,ii)=>{ const c=document.createElement("canvas"), img=new Image(); img.src=src; wrap.appendChild(c);
    img.onload=()=>{ c.width=img.width; c.height=img.height; const g=c.getContext("2d"); g.drawImage(img,0,0);
      const lw=Math.max(3,img.width/200), fs=Math.max(22,img.width/22);
      (r.findings||[]).filter(f=>f.show!==false).forEach(f=>(f.blocks||[]).forEach(bi=>{ const b=r.blocks[bi]; if(!b||b.img!==ii||!b.box) return;
        const [y0,x0,y1,x1]=b.box.map(v=>v/1000); g.strokeStyle="#d0162f"; g.lineWidth=lw; g.strokeRect(x0*img.width,y0*img.height,(x1-x0)*img.width,(y1-y0)*img.height);
        const cx=Math.max(fs*.7,x0*img.width-fs*.2), cy=y0*img.height+fs*.7; g.fillStyle="#d0162f"; g.beginPath(); g.arc(cx,cy,fs*.65,0,7); g.fill();
        g.fillStyle="#fff"; g.font=`700 ${fs}px sans-serif`; g.textAlign="center"; g.textBaseline="middle"; g.fillText(String(f.no),cx,cy+1) })) } });
  return wrap;
}
function naverView(r){
  // 발행 글: 네이버 화면 코드를 그대로(그림자 영역 안에서 네이버 스타일로) 그리고 위에 번호 상자를 올립니다. PDF에서도 쪽이 나뉘어 끝까지 찍힙니다.
  const host=document.createElement("div"); host.className="nview"; const root=host.attachShadow({mode:"open"});
  root.innerHTML=`${(r.viewCss||[]).map(u=>`<link rel="stylesheet" href="${esc(u)}">`).join("")}
  <style>:host{display:block;background:#fff;color:#111}.wrap{position:relative;padding:8px 14px 30px 38px;background:#fff}img{max-width:100%!important;height:auto!important}
  a{pointer-events:none;color:inherit}
  .br-mark{position:relative!important;outline:2.5px solid #d0162f;outline-offset:3px;border-radius:2px}
  .br-mark.br-soft{outline-style:dashed}
  .br-no{position:absolute;left:-34px;top:-2px;z-index:50;width:24px;height:24px;border-radius:50%;background:#d0162f;color:#fff;font:700 13px/24px sans-serif;text-align:center;pointer-events:auto;cursor:pointer;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .br-no.soft{background:#fff;color:#d0162f;border:2px solid #d0162f;line-height:20px}</style>
  <div class="wrap"><div class="se-viewer se-theme-default">${r.viewHtml}</div></div>`;
  const wrap=root.querySelector(".wrap"), comps=[...root.querySelectorAll(".se-component")];
  function target(b){ const c=comps[b.ci]; if(!c) return null; if(b.type==="text"&&typeof b.pi==="number"){ const ps=[...c.querySelectorAll("p.se-text-paragraph")].filter(p=>p.textContent.replace(/\u200b/g,"").trim()); return ps[b.pi]||c } return c }
  function draw(){
    root.querySelectorAll(".br-no").forEach(x=>x.remove()); root.querySelectorAll("[data-br]").forEach(x=>{ x.removeAttribute("data-br"); x.classList.remove("br-mark","br-soft") });
    (r.findings||[]).filter(f=>f.show!==false).forEach(f=>(f.blocks||[]).filter(x=>x>=0).slice(0,3).forEach(bi=>{ const b=r.blocks[bi]; if(!b) return; const el=target(b); if(!el) return;
      // 표시를 글 요소 자체에 붙여서 화면 폭이나 PDF로 바뀌어도 위치가 어긋나지 않게 합니다.
      el.classList.add("br-mark"); if(f.status!=="수정 필요"&&!el.dataset.br) el.classList.add("br-soft"); if(f.status==="수정 필요") el.classList.remove("br-soft");
      const k=(el.dataset.br?el.dataset.br.split(",").length:0); el.dataset.br=(el.dataset.br?el.dataset.br+",":"")+f.no;
      const n=document.createElement("span"); n.className="br-no"+(f.status==="수정 필요"?"":" soft"); n.textContent=f.no; n.style.top=(k*28-2)+"px"; n.title=f.title;
      n.onclick=()=>{ const cd=document.getElementById("card-"+f.no); if(cd) cd.scrollIntoView({behavior:"smooth",block:"start"}) };
      el.appendChild(n) })) }
  host._draw=draw;
  host._goto=no=>{ const bx=[...root.querySelectorAll("[data-br]")].find(e=>e.dataset.br.split(",").includes(String(no))), sc=host.parentElement; if(bx&&sc){ const t=bx.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop-80; sc.scrollTo({top:Math.max(0,t),behavior:"smooth"}) } };
  setTimeout(draw,0);
  return host;
}
function vol(x){ if(x.pc==null&&x.mobile==null) return ""; const n=v=>typeof v==="number"?v:0; const sum=n(x.pc)+n(x.mobile); const lt=String(x.pc).includes("<")||String(x.mobile).includes("<"); return lt&&!sum?"10 미만":sum.toLocaleString("ko-KR")+(lt?"+":"") }
function renderSheet(){
  const r=CUR, F=r.findings||[], S=r.summary||{}, st=r.stats||{};
  const shown=F.filter(f=>f.show!==false);
  const top=shown.filter(f=>f.status==="수정 필요").concat(shown.filter(f=>f.status==="추가 확인"),shown.filter(f=>f.status==="권장")).slice(0,3);
  const opinion=r.opinionText||OPINION_DEFAULT;
  const kwRows=(r.keywordTable||[]).map(k=>{ const e=k.evidence||{}, v=e.volume;
    const rk=e.rankScreen>0?`이 글 ${e.rankScreen}위`:e.rankScreen===0?"이 글 10위 밖":"";
    return `<tr><td>${esc(k.kw)}<div class="ev">${esc(k.type)}</div></td><td class="${k.where==="없음"?"miss":""}">${esc(k.where)}</td><td>${v?esc(vol(v)):"—"}</td><td class="ev">${e.at?`${esc(e.at.slice(5,16))} 조회${rk?" · "+esc(rk):""}${e.link?` · <a href="${esc(e.link)}" target="_blank" rel="noopener">검색 결과</a>`:""}`:""}</td></tr>` }).join("");
  const TS=r.tagSuggest||{list:[]};
  const curTags=Array.isArray(r.tags)?(r.tags.length?r.tags.map(t=>`<span class="chip on">#${esc(t)}</span>`).join(""):`<span class="miss">태그 없음</span>`):`<span class="hint">${r.source==="link"?"읽지 못함":"발행 글 링크로 검수하면 확인합니다"}</span>`;
  const sugTags=(TS.list||[]).map(t=>`<span class="chip ${t.src==="상호"?"brand":""}" title="${esc(t.src)}">#${esc(t.tag)}${vol(t)?`<small>${esc(vol(t))}</small>`:""}</span>`).join("");
  const checks=r.checklist||[]; let g="";
  const chk=checks.map(c=>{ const head=c.group!==g?`<div class="g">${esc(c.group)}</div>`:""; g=c.group;
    const cls=/❌|확인 필요/.test(c.state)?"no":/✅/.test(c.state)?"yes":"";
    return head+`<div class="it ${cls==="no"?"hot":""}"><span class="st ${cls}">${esc(c.state)}</span><span>${esc(c.item)}</span><span class="who">${esc(c.who)}</span></div>` }).join("");
  const nNo=checks.filter(c=>/❌|확인 필요/.test(c.state)).length, nBox=checks.filter(c=>c.state==="☐").length;
  const aiS=r.aiSearch||[], aiBad=aiS.filter(a=>!a.ok).length;
  const cards=F.filter(f=>f.show!==false||EDIT).map(f=>{
    const bi=(f.blocks||[]).filter(x=>x>=0)[0], b=r.blocks[bi];
    let ex=""; if(b&&!(b.box&&r._capture)){ ex=`<div class="excerpt">${bi>0&&r.blocks[bi-1].type==="text"&&b.type==="text"?`<p class="ctx">${esc(r.blocks[bi-1].text.slice(-60))}</p>`:""}<div>${blockHtml(b,f.quote)}</div></div>` } else if(b) ex=`<div class="excerpt" data-bi="${bi}"></div>`;
    const ev=(f.evidence||[]).map(e=>`<li>${esc(e.label)}: <b>${esc(e.value)}</b>${e.link?` · <a href="${esc(e.link)}" target="_blank" rel="noopener">열기</a>`:""}${e.at?` · ${esc(e.at.slice(5,16))}`:""}</li>`).join("");
    return `<article class="card ${f.show===false?"off":""}" id="card-${f.no}" data-no="${f.no}">
      <div class="ch"><span class="mk ${f.status==="수정 필요"?"":"soft"}">${f.no}</span><h4>${esc(f.title)}</h4><span class="tag ${TAGCLS[f.status]||""}">${esc(TAGTXT[f.status]||f.status)}</span>
        <label class="only-edit no-export" style="flex-direction:row;gap:6px;margin-left:auto;font-size:.85rem"><input type="checkbox" class="keep" data-no="${f.no}" ${f.show!==false?"checked":""}>보내기에 넣기</label></div>
      ${ex}
      <p class="comment" data-no="${f.no}" ${EDIT?"contenteditable=true":""}>${esc(f.comment)}</p>
      ${f.suggestion||EDIT?`<div class="fix"><span class="lbl">고친 예시</span><span class="sugg" data-no="${f.no}" ${EDIT?"contenteditable=true":""}>${esc(f.suggestion||"")}</span><button class="btn ghost small no-export copy" data-copy="${esc(f.suggestion||"")}">복사</button></div>`:""}
      <ul class="evid"><li>근거 · ${esc(f.source==="AI"?"AI 첨삭":"앱 확인")} · ${esc(f.area)}</li>${ev}</ul>
    </article>` }).join("");
  const hasFrame=!!r.viewHtml, hasCap=!!(r._capture&&r._capture.length);
  const proof=(r.blocks||[]).map((b,i)=>{ const fs=shown.filter(f=>(f.blocks||[]).includes(i)); const q=fs.map(f=>f.quote).find(Boolean);
    const marks=fs.length?`<span class="marks">${fs.map(f=>`<a class="mk ${f.status==="수정 필요"?"":"soft"}" href="#card-${f.no}">${f.no}</a>`).join("")}</span>`:"";
    return `<div class="${blkClass(b)} ${fs.length?"flag":""}">${marks}${blockHtml(b,q)}</div>` }).join("");
  const nextT=(r.nextTopics||[]).map((t,i)=>`<li><b>${esc(t.title)}</b><span class="hint">검색할 말: ${esc(t.keyword)}${vol(t)?` · 최근 30일 ${esc(vol(t))}회`:""}</span><span>${esc(t.why)}</span></li>`).join("");
  const sumBox=(r.summaryBox||[]).filter(Boolean), faq=r.faq||[];
  $("#result").innerHTML=`
  <div class="row no-print toolbar">
    <button class="btn" id="pdfBtn">PDF로 저장</button>
    <button class="btn ghost small" id="edBtn">${EDIT?"고치기 끝내고 저장":"문장 고치기"}</button>
    <span class="status" id="shStatus">${EDIT?"카드 문장을 눌러 고치고, 보내지 않을 카드는 체크를 빼 주세요.":"보내기 전에 표현을 바꾸고 싶을 때만 문장 고치기를 누르시면 됩니다."}</span>
  </div>
  <div class="sheet ${EDIT?"editing":""}" id="sheet">
    <div class="masthead"><h2>${esc(r.bizName)} 블로그 첨삭지</h2><span class="meta">${esc(r.createdAt.slice(0,10))} · ${esc(r.source==="link"?"발행 글":r.source==="text"?"발행 전 원고":"화면 캡처")}</span></div>
    <p class="opinion" id="opinion" ${EDIT?"contenteditable=true":""}>${esc(opinion)}</p>
    <div class="glance">
      <div class="g-left">
        <p class="g-title">${esc(r.title)}</p>
        <p class="head ${S.must?"must":""}">${esc(S.headline||"")}</p>
        <div class="counts"><span><b>${S.must||0}</b>꼭 고쳐 주실 것</span><span><b>${S.suggest||0}</b>권해 드리는 것</span><span><b>${S.check||0}</b>확인이 필요한 것</span></div>
        <div class="stats">${[["글자",st.chars],["사진",st.photos],["지도",st.maps],["소제목",st.headings],["인용구",st.quotes],["표",st.tables],["태그",st.tags==null?"—":st.tags]].map(([k,v])=>`<span><b>${esc(v==null?0:v)}</b>${k}</span>`).join("")}</div>
      </div>
      <div class="g-right">
        <h3>먼저 고칠 것</h3>
        <ol class="firsts">${top.map(f=>`<li><a href="#card-${f.no}" data-go="${f.no}"><span class="mk ${f.status==="수정 필요"?"":"soft"}">${f.no}</span>${esc(f.title)}</a></li>`).join("")||"<li>따로 고칠 것이 없습니다</li>"}</ol>
        ${(r.good||[]).length?`<p class="goodline"><b>잘된 점</b> ${esc(r.good[0].text)}</p>`:""}
      </div>
    </div>
    <div class="split">
      <div class="orig"><div class="orighead"><h3>원문에 표시</h3><span class="viewtag">${hasFrame?"네이버 화면 그대로":hasCap?"올린 캡처":"재구성 화면 — 실제와 줄바꿈이 다를 수 있습니다"}</span></div>
        <div class="origscroll" id="origscroll">${hasFrame||hasCap?"":`<div class="proof">${proof}</div>`}</div></div>
      <div class="cards"><h3 class="cards-h">의견 ${shown.length}개</h3>${cards||`<p class="hint">따로 드릴 의견이 없습니다.</p>`}</div>
    </div>
    <details class="sec" open><summary><h3>키워드와 해시태그</h3><span class="sum">${(r.keywordTable||[]).filter(k=>k.where==="없음").length}개 키워드가 글에 없음 · 추천 태그 ${(TS.list||[]).length}개</span></summary>
      <div class="secbody">
        ${kwRows?`<table class="plain kwtable"><thead><tr><th>핵심 키워드</th><th>이 글에서</th><th>최근 30일 검색량</th><th>근거</th></tr></thead><tbody>${kwRows}</tbody></table>`:""}
        <div><p class="lbl2">지금 글에 붙은 태그</p><div class="chips">${curTags}</div></div>
        <div><div class="row" style="justify-content:space-between"><p class="lbl2">추천 해시태그 <small class="hint">상호 → 핵심 키워드 → 자동완성 → AI 제안 순, 숫자는 최근 30일 검색량</small></p><button class="btn ghost small no-export copy" data-copy="${esc((TS.list||[]).map(t=>"#"+t.tag).join(" "))}">모두 복사</button></div>
          <div class="chips">${sugTags||`<span class="hint">추천할 태그가 없습니다</span>`}</div>
          ${TS.note?`<p class="hint">${esc(TS.note)}</p>`:""}</div>
      </div></details>
    <details class="sec" open><summary><h3>AI 검색 대비</h3><span class="sum">${aiS.length?`${aiS.length-aiBad}/${aiS.length} 충족`:"AI 첨삭을 하면 점검합니다"}</span></summary>
      <div class="secbody">
        <p class="hint">네이버 AI 브리핑·ChatGPT 같은 AI 검색이 이 글을 답변 근거로 가져가기 쉬운지 봅니다. 충족해도 노출이 보장되지는 않습니다.</p>
        <ul class="aich">${aiS.map(a=>`<li class="${a.ok?"ok":"no"}"><span class="st">${a.ok?"✅":"⚠"}</span><b>${esc(a.item)}</b><span>${esc(a.note)}</span></li>`).join("")}</ul>
        ${sumBox.length?`<div class="fix"><span class="lbl">글 맨 위 3줄 요약</span><span class="sugg">${sumBox.map(esc).join("<br>")}</span><button class="btn ghost small no-export copy" data-copy="${esc(sumBox.join("\n"))}">복사</button></div>`:""}
        ${faq.length?`<div class="fix"><span class="lbl">덧붙일 FAQ</span><span class="sugg">${faq.map(x=>`<b>Q. ${esc(x.q)}</b><br>A. ${esc(x.a)}`).join("<br><br>")}</span><button class="btn ghost small no-export copy" data-copy="${esc(faq.map(x=>"Q. "+x.q+"\nA. "+x.a).join("\n\n"))}">복사</button></div>`:""}
      </div></details>
    ${nextT?`<details class="sec" open><summary><h3>다음 글 추천</h3><span class="sum">이 글에 이어서 쓰면 좋은 글 ${(r.nextTopics||[]).length}편</span></summary><div class="secbody"><ol class="nexts">${nextT}</ol></div></details>`:""}
    <details class="sec"><summary><h3>발행 전 체크리스트</h3><span class="sum">❌ ${nNo} · 직접 확인 ${nBox}</span></summary><div class="secbody"><div class="check">${chk}</div></div></details>
    <p class="foot">검수일 ${esc(r.createdAt)} · 업체 정보 확인일 ${esc((r.bizSnapshot||{}).placeCheckedAt||"미기록")} · 키워드 근거는 조회 시각 기준 · 이노브웨이</p>
  </div>`;
  const sc=$("#origscroll");
  if(hasFrame){ const v=naverView(r); sc.appendChild(v); CUR._frame=v }
  else if(hasCap){ sc.appendChild(capOverlay(r)) }
  $$(".excerpt[data-bi]").forEach(el=>{ const b=r.blocks[+el.dataset.bi]; if(b&&b.box&&r._capture){ const c=cropCanvas(b); if(c) el.appendChild(c) } });
  $$(".card").forEach(c=>c.addEventListener("click",e=>{ if(e.target.closest("button,label,a,[contenteditable=true]")) return; if(CUR._frame&&CUR._frame._goto) CUR._frame._goto(c.dataset.no) }));
  $$("[data-go]").forEach(a=>a.addEventListener("click",()=>{ if(CUR._frame&&CUR._frame._goto) CUR._frame._goto(a.dataset.go) }));
  $("#edBtn").onclick=async()=>{ collectEdits(); const was=EDIT; EDIT=!EDIT; renderSheet(); if(was) await saveEdits() };
  $("#pdfBtn").onclick=printPdf;
  $$(".copy").forEach(b=>b.onclick=async e=>{ e.stopPropagation(); try{ await navigator.clipboard.writeText(b.dataset.copy||""); b.textContent="복사함" }catch(err){ b.textContent="복사 안 됨" } });
  $$(".keep").forEach(c=>c.onchange=()=>{ const f=F.find(x=>x.no==c.dataset.no); f.show=c.checked; c.closest(".card").classList.toggle("off",!c.checked) });
}
function collectEdits(){ if(!CUR||!EDIT) return; const o=$("#opinion"); if(o) CUR.opinionText=o.innerText.trim()||OPINION_DEFAULT;
  $$(".comment[data-no]").forEach(p=>{ const f=CUR.findings.find(x=>x.no==p.dataset.no); if(f) f.comment=p.innerText.trim() });
  $$(".sugg[data-no]").forEach(p=>{ const f=CUR.findings.find(x=>x.no==p.dataset.no); if(f) f.suggestion=p.innerText.trim() }) }
async function saveEdits(){ collectEdits(); status($("#shStatus"),"저장하는 중…");
  try{ await api("saveReview",{id:CUR.id,patch:{findings:CUR.findings,opinionText:CUR.opinionText||""}}); status($("#shStatus"),"저장했습니다.") }catch(e){ status($("#shStatus"),e.message,true) } }
async function printPdf(){
  if(EDIT){ collectEdits(); EDIT=false; renderSheet(); await saveEdits() }
  const ds=$$("#sheet details"), opened=ds.map(d=>d.open); ds.forEach(d=>d.open=true);
  const t=document.title; document.title=`첨삭지_${CUR.bizName}_${CUR.createdAt.slice(0,10)}`;
  document.body.classList.add("printing"); if(CUR._frame&&CUR._frame._draw) setTimeout(CUR._frame._draw,0);
  await new Promise(ok=>setTimeout(ok,300));
  window.print();
  document.title=t; document.body.classList.remove("printing"); ds.forEach((d,i)=>d.open=opened[i]); if(CUR._frame&&CUR._frame._draw) setTimeout(CUR._frame._draw,50);
}
async function exportPng(){
  collectEdits(); const wasEdit=EDIT; if(EDIT){ EDIT=false; renderSheet() }
  const sheet=$("#sheet"); status($("#shStatus"),"이미지를 만드는 중…");
  try{
    // 네이버 사진은 다른 사이트 그림이라 그대로는 이미지에 안 들어가서 서버에서 받아 바꿉니다.
    const imgs=$$("#sheet img[data-src]"), urls=[...new Set(imgs.map(i=>i.dataset.src))];
    if(urls.length){ try{ const map=await api("imageData",{urls}); imgs.forEach(i=>{ if(map[i.dataset.src]){ i.removeAttribute("crossorigin"); i.src=map[i.dataset.src] } }) }catch(e){} }
    imgs.forEach(i=>{ i.loading="eager" });
    await Promise.race([Promise.all(imgs.map(i=>i.complete?0:new Promise(ok=>{i.onload=i.onerror=ok}))),new Promise(ok=>setTimeout(ok,8000))]);
    const opened=$$("#sheet details").map(d=>{ const o=d.open; d.open=true; return o });
    sheet.classList.add("exporting"); sheet.style.width="540px";
    const canvas=await html2canvas(sheet,{scale:2,useCORS:true,backgroundColor:getComputedStyle(sheet).backgroundColor,width:540,windowWidth:900});
    sheet.classList.remove("exporting"); sheet.style.width=""; $$("#sheet details").forEach((d,i)=>d.open=opened[i]);
    const a=document.createElement("a"); a.href=canvas.toDataURL("image/png"); a.download=`첨삭지_${CUR.bizName}_${CUR.createdAt.slice(0,10)}.png`; a.click();
    status($("#shStatus"),"이미지를 저장했습니다.");
  }catch(e){ sheet.classList.remove("exporting"); sheet.style.width=""; status($("#shStatus"),"이미지를 만들지 못했습니다. PDF로 저장해 주세요.",true) }
  if(wasEdit){ EDIT=true; renderSheet() }
}

async function loadHistory(){ $("#hsList").innerHTML=`<p class="hint">불러오는 중…</p>`;
  try{ const L=await api("listReviews",{bizId:$("#hsBiz").value});
    $("#hsList").innerHTML=L.length?L.map(x=>`<button data-id="${esc(x.id)}"><span>${esc(x.title)}<br><small>${esc((BIZ.find(b=>b.id===x.bizId)||{}).name||"")} · ${esc(x.summary&&x.summary.headline||"")}</small></span><small>${esc(x.createdAt.slice(0,16))}</small></button>`).join(""):`<p class="hint">아직 검수 기록이 없습니다. 검수 탭에서 첫 글을 검수해 주세요.</p>`;
    $$("#hsList button").forEach(b=>b.onclick=async()=>{ CUR=await api("getReview",{id:b.dataset.id}); EDIT=false; show("review"); renderSheet(); $("#result").scrollIntoView({behavior:"smooth"}) });
  }catch(e){ $("#hsList").innerHTML=`<p class="status err">${esc(e.message)}</p>` } }
$("#hsBiz").onchange=loadHistory;

if(AUTH.adminPw) login(AUTH.adminPw);
